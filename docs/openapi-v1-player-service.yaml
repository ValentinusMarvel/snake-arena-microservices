openapi: 3.0.1
info:
  title: Snake Arena - Player Service API
  description: |
    Layanan Manajemen Profil Pemain dan Kelas Ular (Snake Classes).

    **Tim Pengembang:**
    - Valentinus Marvel (245150201111027)
    - Muhammad Raditya Arsyad (245150207111043)
    - Muhamad Fahmi Siddiq Aqsha (245150200111030)
    - Dafid Rosydan Hanif (245150200111029)

    **Mata Kuliah:** Arsitektur Berbasis Layanan (ABL)

    ### Fitur Versioning (Breaking Changes):
    - **v1 (Legacy API)**: Menggunakan struktur data flat untuk snakeType dan speed.
    - **v2 (Modern RPG)**: Menghapus snakeType dan speed, menggantikannya dengan nested object `classProfile` dengan skill cooldown & active modifiers.
  contact:
    name: Tim Pengembang ABL
  version: 1.0.0 / 2.0.0
servers:
- url: http://localhost:8081
  description: Generated server url
tags:
- name: v1-players
  description: API Profil Pemain Versi 1 (Legacy Flat Contract)
paths:
  /api/v1/players/{id}:
    get:
      tags:
      - v1-players
      summary: Mengambil detail pemain berdasarkan ID (v1 GET)
      operationId: getPlayerById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Pemain ditemukan
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlayerV1Output'
        "404":
          description: Pemain tidak ditemukan
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlayerV1Output'
    put:
      tags:
      - v1-players
      summary: Mengubah / replace data pemain seutuhnya (v1 PUT)
      operationId: updatePlayer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerV1Input'
        required: true
      responses:
        "200":
          description: Pemain berhasil diperbarui
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlayerV1Output'
        "404":
          description: Pemain tidak ditemukan
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlayerV1Output'
    delete:
      tags:
      - v1-players
      summary: Menghapus akun pemain (v1 DELETE)
      operationId: deletePlayer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Pemain berhasil dihapus
        "404":
          description: Pemain tidak ditemukan
  /api/v1/players:
    get:
      tags:
      - v1-players
      summary: Mengambil semua daftar pemain (v1 GET)
      operationId: getAllPlayers
      responses:
        "200":
          description: Daftar pemain berhasil diambil
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerV1Output'
    post:
      tags:
      - v1-players
      summary: Mendaftar player baru (v1 POST)
      operationId: createPlayer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerV1Input'
        required: true
      responses:
        "201":
          description: Pemain berhasil didaftarkan
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlayerV1Output'
        "400":
          description: Username atau tipe ular tidak valid
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlayerV1Output'
  /api/v1/players/{id}/stats:
    patch:
      tags:
      - v1-players
      summary: Modifikasi parsial skor dan jumlah match (v1 PATCH)
      operationId: updateStats
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerStatsUpdateInput'
        required: true
      responses:
        "200":
          description: Skor berhasil diperbarui
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlayerV1Output'
        "404":
          description: Pemain tidak ditemukan
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlayerV1Output'
components:
  schemas:
    PlayerV1Input:
      required:
      - snakeType
      - username
      type: object
      properties:
        username:
          maxLength: 30
          minLength: 3
          type: string
          description: Nama panggilan pemain dengan tag unik
          example: PlayerOne#1024
        snakeType:
          type: string
          description: "Tipe ular (VIPER, PYTHON, COBRA)"
          example: VIPER
    PlayerV1Output:
      type: object
      properties:
        id:
          type: string
          example: PL-101
        username:
          type: string
          example: PlayerOne
        snakeType:
          type: string
          example: VIPER
        speed:
          type: integer
          format: int32
          example: 6
        highScore:
          type: integer
          format: int32
          example: 150
        totalMatches:
          type: integer
          format: int32
          example: 3
        createdAt:
          type: string
          example: 2026-09-20T16:00:00
    PlayerStatsUpdateInput:
      type: object
      properties:
        score:
          minimum: 0
          type: integer
          description: Skor akhir yang diraih dalam pertandingan
          format: int32
          example: 120
        matchCompleted:
          type: boolean
          description: Apakah pertandingan selesai
          example: true
