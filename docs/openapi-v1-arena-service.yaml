openapi: 3.0.1
info:
  title: Snake Arena - Gameplay & Session Service API
  description: |
    Layanan Arena Gameplay Session, Makanan (Apel), Tabrakan, Leaderboard, dan Inter-service Communication.

    **Tim Pengembang:**
    - Valentinus Marvel (245150201111027)
    - Muhammad Raditya Arsyad (245150207111043)
    - Muhamad Fahmi Siddiq Aqsha (245150200111030)
    - Dafid Rosydan Hanif (245150200111029)

    **Mata Kuliah:** Arsitektur Berbasis Layanan (ABL)
  contact:
    name: Tim Pengembang ABL
  version: 1.0.0
servers:
- url: http://localhost:8082
  description: Generated server url
tags:
- name: arena
  description: API Arena Pertandingan Ular (Gameplay Session)
paths:
  /api/v1/arena/snakes/{id}/loadout:
    put:
      tags:
      - arena
      summary: Mengganti loadout / skin ular di arena (PUT)
      operationId: updateLoadout
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadoutUpdateInput'
        required: true
      responses:
        "200":
          description: Loadout berhasil diubah
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Snake'
        "404":
          description: Ular tidak ditemukan
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Snake'
  /api/v1/arena/snakes:
    post:
      tags:
      - arena
      summary: Bergabung ke arena dengan ular baru (POST)
      operationId: joinArena
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinArenaInput'
        required: true
      responses:
        "201":
          description: Ular berhasil masuk ke arena
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Snake'
        "400":
          description: Data input tidak valid / Arena penuh
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Snake'
  /api/v1/arena/snakes/{id}/leave:
    post:
      tags:
      - arena
      summary: Meninggalkan arena pertandingan (mendukung navigator.sendBeacon) (POST)
      operationId: leaveArenaPost
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/v1/arena/snakes/{id}/skill:
    patch:
      tags:
      - arena
      summary: Mengaktifkan/mematikan skill kelas ular (PATCH)
      operationId: toggleSkill
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: active
        in: query
        required: true
        schema:
          type: boolean
      responses:
        "200":
          description: Status skill diperbarui
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Snake'
  /api/v1/arena/snakes/{id}/position:
    patch:
      tags:
      - arena
      summary: Sinkronisasi posisi segmen ular secara manual (PATCH)
      operationId: updatePosition
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePositionInput'
        required: true
      responses:
        "200":
          description: Posisi ular berhasil diperbarui
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Snake'
        "404":
          description: Ular tidak ditemukan
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Snake'
  /api/v1/arena/snakes/{id}/heartbeat:
    patch:
      tags:
      - arena
      summary: Mengirim sinyal heartbeat dari client agar ular tidak terputus (PATCH)
      operationId: heartbeat
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Snake'
  /api/v1/arena/snakes/{id}/eat:
    patch:
      tags:
      - arena
      summary: Mengkonsumsi apel di arena (PATCH)
      operationId: eatApple
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EatAppleInput'
        required: true
      responses:
        "200":
          description: "Apel dimakan, skor dan panjang bertambah"
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Snake'
        "404":
          description: Ular tidak ditemukan
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Snake'
  /api/v1/arena/snakes/{id}/direction:
    patch:
      tags:
      - arena
      summary: Mengubah arah pergerakan ular secara real-time (PATCH)
      operationId: changeDirection
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: dir
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Arah ular berhasil diubah
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Snake'
        "404":
          description: Ular tidak ditemukan
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Snake'
  /api/v1/arena/state:
    get:
      tags:
      - arena
      summary: Mengambil kondisi arena snapshot terkini (GET)
      operationId: getArenaState
      responses:
        "200":
          description: State arena berhasil diambil
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ArenaState'
  /api/v1/arena/snakes/{id}:
    get:
      tags:
      - arena
      summary: Mengambil detail ular di arena berdasarkan ID (GET)
      operationId: getSnakeById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Data ular ditemukan
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Snake'
        "404":
          description: Ular tidak ada di arena
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Snake'
    delete:
      tags:
      - arena
      summary: Ular tereliminasi / keluar dari arena (DELETE) -> Memicu sinkronisasi
        skor ke Player Service
      operationId: eliminateSnake
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Ular berhasil keluar dan skor tersinkronisasi
        "404":
          description: Ular tidak ditemukan
components:
  schemas:
    LoadoutUpdateInput:
      required:
      - snakeType
      type: object
      properties:
        snakeType:
          type: string
          example: COBRA
        color:
          type: string
          example: '#ffd700'
    Point:
      type: object
      properties:
        x:
          type: integer
          format: int32
        "y":
          type: integer
          format: int32
    Snake:
      type: object
      properties:
        id:
          type: string
        playerId:
          type: string
        playerName:
          type: string
        snakeType:
          type: string
        color:
          type: string
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Point'
        direction:
          type: string
        score:
          type: integer
          format: int32
        alive:
          type: boolean
        skillActive:
          type: boolean
        skillActivatedAt:
          type: integer
          format: int64
        skillCooldownUntil:
          type: integer
          format: int64
        lastHeartbeatTime:
          type: integer
          format: int64
    JoinArenaInput:
      required:
      - playerId
      - playerName
      - snakeType
      type: object
      properties:
        playerId:
          type: string
          example: PL-101
        playerName:
          type: string
          example: PlayerOne
        snakeType:
          type: string
          example: VIPER
        color:
          type: string
          example: '#00ff88'
    UpdatePositionInput:
      type: object
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Point'
        direction:
          type: string
    EatAppleInput:
      required:
      - appleId
      type: object
      properties:
        appleId:
          type: string
          example: APL-1
    Apple:
      type: object
      properties:
        id:
          type: string
        x:
          type: integer
          format: int32
        "y":
          type: integer
          format: int32
        type:
          type: string
        points:
          type: integer
          format: int32
    ArenaState:
      type: object
      properties:
        gridWidth:
          type: integer
          format: int32
        gridHeight:
          type: integer
          format: int32
        maxPlayers:
          type: integer
          format: int32
        activePlayers:
          type: integer
          format: int32
        snakes:
          type: array
          items:
            $ref: '#/components/schemas/Snake'
        apples:
          type: array
          items:
            $ref: '#/components/schemas/Apple'
        leaderboard:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    LeaderboardEntry:
      type: object
      properties:
        snakeId:
          type: string
        playerName:
          type: string
        snakeType:
          type: string
        score:
          type: integer
          format: int32
