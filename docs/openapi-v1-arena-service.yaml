openapi: 3.0.3
info:
  title: Snake Arena - Arena Service API
  version: 1.0.0
  description: >
    Layanan Manajemen Sesi Arena Pertandingan Real-Time Versi 1.0.
    Mendukung registrasi/spawn serpent, snapshot state arena komprehensif, telemetri ular, modifikasi arah/posisi/skill/loadout, konsumsi apel, dan eliminasi ular dengan sinkronisasi skor antarlayanan.
  contact:
    name: Tim Pengembang Snake Arena (ABL FILKOM UB)
servers:
  - url: http://localhost:8082
    description: Lingkungan Lokal Arena Service
paths:
  /api/v1/arena/snakes:
    post:
      summary: Bergabung ke Arena Pertandingan (v1 POST)
      description: >
        Menginisiasi dan melakukan spawn entitas ular baru ke dalam arena pertandingan dengan posisi acak aman dan warna kustom.
      operationId: joinArena
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinArenaInput'
      responses:
        '201':
          description: Ular berhasil di-spawn ke dalam arena
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snake'
        '400':
          description: Kapasitas arena penuh (maksimal 16 pemain) atau data input tidak valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/arena/state:
    get:
      summary: Mengambil Snapshot Kondisi Arena Terkini (v1 GET)
      description: >
        Mengambil seluruh telemetri arena secara komprehensif, mencakup tick waktu server,
        koordinat semua ular aktif, posisi apel, dan jumlah pemain aktif.
      operationId: getArenaState
      responses:
        '200':
          description: Snapshot arena berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaState'
  /api/v1/arena/snakes/{id}:
    get:
      summary: Mengambil Kondisi Ular Berdasarkan ID (v1 GET)
      description: Mengambil data koordinat kepala dan badan, status hidup (alive), skor sesi berjalan, serta arah gerak ular tertentu di arena.
      operationId: getSnakeById
      parameters:
        - name: id
          in: path
          required: true
          description: ID unik ular pada sesi arena
          schema:
            type: string
            example: SNK-8821
      responses:
        '200':
          description: Data ular ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snake'
        '404':
          description: Ular dengan ID tersebut tidak ditemukan di dalam arena
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      summary: Eliminasi Ular dan Sinkronisasi Skor (v1 DELETE)
      description: >
        Mengeluarkan ular dari arena pertandingan dan memicu pemanggilan REST antarlayanan ke player-service
        untuk menyinkronkan perolehan skor akhir ke basis data pemain.
      operationId: eliminateSnake
      parameters:
        - name: id
          in: path
          required: true
          description: ID unik ular yang tereliminasi
          schema:
            type: string
            example: SNK-8821
      responses:
        '204':
          description: Ular berhasil dikeluarkan dan skor tersinkronisasi
        '404':
          description: Ular tidak ditemukan di dalam arena
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/arena/snakes/{id}/loadout:
    put:
      summary: Mengganti Loadout dan Skin Ular di Arena (v1 PUT)
      description: Mengganti kelas serpent atau warna tubuh ular secara menyeluruh saat aktif bermain di arena.
      operationId: updateLoadout
      parameters:
        - name: id
          in: path
          required: true
          description: ID unik ular di arena
          schema:
            type: string
            example: SNK-8821
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadoutUpdateInput'
      responses:
        '200':
          description: Loadout serpent berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snake'
        '400':
          description: Parameter loadout tidak valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Ular tidak ditemukan di dalam arena
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/arena/snakes/{id}/direction:
    patch:
      summary: Mengubah Arah Pergerakan Ular Real-Time (v1 PATCH)
      description: Mengubah arah vektor gerak kepala ular secara real-time pada siklus game loop 250ms.
      operationId: changeDirection
      parameters:
        - name: id
          in: path
          required: true
          description: ID unik ular
          schema:
            type: string
            example: SNK-8821
        - name: dir
          in: query
          required: true
          description: Arah baru pergerakan serpent
          schema:
            type: string
            enum: [UP, DOWN, LEFT, RIGHT]
            example: RIGHT
      responses:
        '200':
          description: Arah serpent berhasil diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snake'
        '404':
          description: Ular tidak ditemukan
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/arena/snakes/{id}/position:
    patch:
      summary: Sinkronisasi Posisi Segmen Ular (v1 PATCH)
      description: Sinkronisasi manual susunan koordinat segmen tubuh ular untuk koreksi latensi client-server.
      operationId: updatePosition
      parameters:
        - name: id
          in: path
          required: true
          description: ID unik ular
          schema:
            type: string
            example: SNK-8821
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePositionInput'
      responses:
        '200':
          description: Posisi koordinat segmen berhasil disinkronkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snake'
        '404':
          description: Ular tidak ditemukan
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/arena/snakes/{id}/eat:
    patch:
      summary: Mengkonsumsi Apel di Arena (v1 PATCH)
      description: Memvalidasi pengambilan apel di grid arena, menambah panjang segmen tubuh, dan meningkatkan skor sesi.
      operationId: eatApple
      parameters:
        - name: id
          in: path
          required: true
          description: ID unik ular
          schema:
            type: string
            example: SNK-8821
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EatAppleInput'
      responses:
        '200':
          description: Apel berhasil dikonsumsi dan status ular diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snake'
        '404':
          description: Ular tidak ditemukan
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/arena/snakes/{id}/skill:
    patch:
      summary: Mengaktifkan atau Mematikan Skill Kelas (v1 PATCH)
      description: Mengaktifkan atau menonaktifkan skill aktif kelas serpent (contoh Venom Dash) selama pertandingan.
      operationId: toggleSkill
      parameters:
        - name: id
          in: path
          required: true
          description: ID unik ular
          schema:
            type: string
            example: SNK-8821
        - name: active
          in: query
          required: true
          description: Status pengaktifan skill
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: Status skill ular berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snake'
        '404':
          description: Ular tidak ditemukan
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/arena/snakes/{id}/heartbeat:
    patch:
      summary: Mengirim Sinyal Heartbeat Koneksi (v1 PATCH)
      description: Menjaga sesi koneksi pemain tetap aktif di arena agar tidak terputus karena batas inaktivitas.
      operationId: heartbeat
      parameters:
        - name: id
          in: path
          required: true
          description: ID unik ular
          schema:
            type: string
            example: SNK-8821
      responses:
        '200':
          description: Sinyal heartbeat berhasil dicatat server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snake'
        '404':
          description: Ular tidak ditemukan
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  schemas:
    JoinArenaInput:
      type: object
      required:
        - playerId
        - playerName
        - snakeType
        - color
      properties:
        playerId:
          type: string
          description: ID pemain yang terdaftar dari player-service
          example: PL-101
        playerName:
          type: string
          description: Nama tampilan pemain di arena
          example: PlayerOne#1024
        snakeType:
          type: string
          enum: [VIPER, PYTHON, COBRA]
          example: VIPER
        color:
          type: string
          description: Kode warna hex untuk rendering serpent
          example: '#00ffcc'
    LoadoutUpdateInput:
      type: object
      required:
        - snakeType
      properties:
        snakeType:
          type: string
          enum: [VIPER, PYTHON, COBRA]
          description: Kelas serpent baru
          example: COBRA
        color:
          type: string
          description: Kode warna heksadesimal baru
          example: '#ffd700'
    EatAppleInput:
      type: object
      required:
        - appleId
      properties:
        appleId:
          type: string
          description: ID unik apel yang dimakan
          example: APL-1
    UpdatePositionInput:
      type: object
      required:
        - segments
        - direction
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        direction:
          type: string
          enum: [UP, DOWN, LEFT, RIGHT]
          example: RIGHT
    Snake:
      type: object
      properties:
        id:
          type: string
          example: SNK-8821
        playerId:
          type: string
          example: PL-101
        playerName:
          type: string
          example: PlayerOne#1024
        snakeType:
          type: string
          example: VIPER
        color:
          type: string
          example: '#00ffcc'
        alive:
          type: boolean
          example: true
        score:
          type: integer
          example: 30
        direction:
          type: string
          enum: [UP, DOWN, LEFT, RIGHT]
          example: RIGHT
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Position'
    Position:
      type: object
      properties:
        x:
          type: integer
          example: 12
        y:
          type: integer
          example: 8
    ArenaState:
      type: object
      properties:
        worldTick:
          type: integer
          example: 1420
        activePlayerCount:
          type: integer
          example: 4
        arenaWidth:
          type: integer
          example: 40
        arenaHeight:
          type: integer
          example: 30
        snakes:
          type: array
          items:
            $ref: '#/components/schemas/Snake'
        apples:
          type: array
          items:
            $ref: '#/components/schemas/Apple'
    Apple:
      type: object
      properties:
        id:
          type: string
          example: APL-3
        x:
          type: integer
          example: 25
        y:
          type: integer
          example: 15
        type:
          type: string
          enum: [NORMAL, GOLDEN]
          example: GOLDEN
        points:
          type: integer
          example: 30
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Arena penuh (maksimal 16 pemain)
        instance:
          type: string
          format: uri
          example: /api/v1/arena/snakes
