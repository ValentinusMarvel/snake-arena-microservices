name: Java CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-player-service:
    name: Test Player Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run Player Service Tests
        working-directory: player-service
        run: chmod +x mvnw && ./mvnw clean test

  test-arena-service:
    name: Test Arena Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run Arena Service Tests
        working-directory: arena-service
        run: chmod +x mvnw && ./mvnw clean test
