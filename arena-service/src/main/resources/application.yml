server:
  port: 8082

spring:
  application:
    name: arena-service

player:
  service:
    url: ${PLAYER_SERVICE_URL:http://localhost:8081}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      circuitbreakers:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      playerService:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
        automaticTransitionFromOpenToHalfOpenEnabled: true


